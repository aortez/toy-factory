name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Source checks and firmware builds
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned development image
        run: make image

      # The image deliberately builds as its unprivileged UID 1000 user. GitHub's
      # checkout may use a different UID, so give that user ownership before the
      # container creates build directories in the bind-mounted repository.
      - name: Prepare checkout for the build container
        run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"

      - name: Check sources and standalone tests
        run: make check-source

      - name: Build default firmware
        run: docker compose run --rm -T firmware ./scripts/container/build.sh --pristine

      - name: Build and smoke-test interactive host player
        run: make host-player-check

      - name: Build PIO firmware variant
        run: make build-pio

      - name: Build PIO and DMA firmware variant
        run: make check-pio-dma

      - name: Build PL022 and DMA firmware variant
        run: make check-pl022-dma

  native-tests:
    name: Native tests (${{ matrix.shard }}/6)
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned development image
        run: make image

      - name: Prepare checkout for the build container
        run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"

      - name: Build native tests
        run: make host-build

      - name: Run native test shard
        run: >-
          docker compose run --rm -T firmware python3 scripts/container/ctest-shard.py
          --build-dir build-host --shard ${{ matrix.shard }} --shards 6
          --output-dir artifacts/ci-tests/native-${{ matrix.shard }}

      - name: Preserve inventory and test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-tests-${{ matrix.shard }}
          path: artifacts/ci-tests/native-${{ matrix.shard }}
          retention-days: 14

  garden-research:
    name: Garden research tests (${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned development image
        run: make image

      - name: Prepare checkout for the build container
        run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"

      - name: Build opt-in Garden research configuration
        run: docker compose run --rm -T firmware bash scripts/container/host-research-check.sh --build-only

      - name: Run Garden research test shard
        run: >-
          docker compose run --rm -T firmware python3 scripts/container/ctest-shard.py
          --build-dir artifacts/build-host-research-check
          --shard ${{ matrix.shard }} --shards 3
          --output-dir artifacts/ci-tests/research-${{ matrix.shard }}

      - name: Preserve inventory and test timings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: research-tests-${{ matrix.shard }}
          path: artifacts/ci-tests/research-${{ matrix.shard }}
          retention-days: 14

  garden-late:
    name: Isolated Garden configurations
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build pinned development image
        run: make image

      - name: Prepare checkout for the build container
        run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"

      - name: Build and test isolated late Garden research configurations
        run: |
          docker compose run --rm -T firmware bash scripts/container/host-late-dispersal-build.sh
          docker compose run --rm -T firmware bash scripts/container/host-landing-seed-replacement-build.sh

  garden-viewer:
    name: Frozen-policy Garden viewer
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare checkout for the build container
        run: sudo chown -R 1000:1000 "$GITHUB_WORKSPACE"

      - name: Build and test frozen-policy Garden research viewer
        run: make host-research-player-check

  complete:
    name: CI complete
    if: always()
    needs: [validate, native-tests, garden-research, garden-late, garden-viewer]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every suite and shard to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          jobs = json.loads(os.environ["RESULTS"])
          failed = {name: job["result"] for name, job in jobs.items()
                    if job["result"] != "success"}
          if not jobs or failed:
              print(f"CI did not pass: {failed}", file=sys.stderr)
              sys.exit(1)
          print("Every CI suite and shard passed.")
          PY
