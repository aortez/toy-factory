<svg xmlns="http://www.w3.org/2000/svg" width="960" height="660" viewBox="0 0 960 660" role="img">
<title>No light setting matches Search 1’s renewal with fixed wear’s survival</title>
<desc>Each point averages 32 whole-population gardens through day 1376. Two blue paths start at fixed wear: the solid one makes the repair light gate stricter, up to never repairing; the dashed one makes it more permissive, down to repairing in darkness. Orange diamonds are the learned finalists. The shaded corner meets both renewal and survival criteria. Vertical whiskers are 95% bootstrap intervals over weather seeds.</desc>
