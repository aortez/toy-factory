description: LCD tearing-effect signal on the Pimoroni PicoSystem

compatible: "pimoroni,picosystem-display-sync"

include: base.yaml

properties:
  te-gpios:
    type: phandle-array
    required: true
    description: Active-high ST7789 tearing-effect output.

  mipi-dbi:
    type: phandle
    required: true
    description: MIPI DBI controller used to enable the panel signal.
