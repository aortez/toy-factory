# Keep bring-up observable. USB CDC console defaults come from the PicoSystem
# board definition.
CONFIG_ADC=y
CONFIG_BASE64=y
CONFIG_CDC_ACM_SERIAL_MANUFACTURER_STRING="Toy Factory"
CONFIG_CDC_ACM_SERIAL_PRODUCT_STRING="Toy Factory PicoSystem"
CONFIG_DISPLAY=y
CONFIG_CRC=y
CONFIG_GPIO=y
CONFIG_INIT_STACKS=y
CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_MBOX=y
CONFIG_PWM=y
CONFIG_REBOOT=y
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_CHECK_DTR=y
CONFIG_SHELL_BACKEND_SERIAL_LOG_MESSAGE_QUEUE_SIZE=512
CONFIG_SHELL_BACKEND_SERIAL_RX_RING_BUFFER_SIZE=128
CONFIG_SHELL_BACKEND_SERIAL_TX_RING_BUFFER_SIZE=1024
CONFIG_SHELL_CMDS_RESIZE=n
CONFIG_SHELL_DEVICE_HELPERS=n
CONFIG_SHELL_LOG_BACKEND=y
CONFIG_SHELL_PROMPT_UART="toy-factory:~$ "
CONFIG_SHELL_PROMPT_CHANGE=n
# The synchronous physics profiler measures about 3.8 KiB on the shell thread.
CONFIG_SHELL_STACK_SIZE=5120
CONFIG_SHELL_STATS=n
CONFIG_SHELL_WILDCARD=n
# Keep recovery and diagnostics responsive even when the simulation overruns.
CONFIG_SHELL_THREAD_PRIORITY_OVERRIDE=y
CONFIG_SHELL_THREAD_PRIORITY=1
CONFIG_SPI=y
CONFIG_ST7789V_RGB565X=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_UART_LINE_CTRL=y
CONFIG_DATE_SHELL=n
CONFIG_DEVICE_SHELL=n
CONFIG_DEVMEM_SHELL=n
CONFIG_KERNEL_SHELL=n
CONFIG_ASSERT=y
CONFIG_MAIN_STACK_SIZE=4608
CONFIG_MAIN_THREAD_PRIORITY=0
